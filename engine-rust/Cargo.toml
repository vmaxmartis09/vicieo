[package]
name = "vicieo"
version = "0.2.0"
edition = "2021"
authors = ["Vicieo Team"]
description = "Vicieo: High-performance, lightweight, multi-platform AI Video Orchestration & Rendering Engine"

[dependencies]
# Async Runtime & Concurrency
tokio = { version = "1.38", features = ["full"] }
futures = "0.3"
async-stream = "0.3"

# Web Server & REST API (Port 9000 & Full Route Suite)
axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
utoipa = { version = "6.0", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "10.0", features = ["axum"] }

# CLI & Terminal UI
clap = { version = "4.5", features = ["derive", "env"] }
indicatif = "0.17"
colored = "2.1"

# Serialization & Dynamic Schema
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# HTTP & AI Gateway
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }

# System, Paths & Utilities
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
thiserror = "1.0"
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"

# Shared by feature tracks (added in Phase 0)
async-trait = "0.1"
tokio-util = "0.7"
tempfile = "3"
regex = "1"
walkdir = "2"
sha2 = "0.10"
base64 = "0.22"
once_cell = "1"
libc = "0.2" # social store: flock interop with Python
zip = { version = "2", default-features = false, features = ["deflate"] } # social manual packages

[[bin]]
name = "vicieo"
path = "src/main.rs"
