[package]
name = "vicieo"
version = "0.1.0"
edition = "2021"
authors = ["Vicieo Team"]
description = "Vicieo: High-performance, lightweight, multi-platform AI Video Orchestration & Rendering Engine"

[dependencies]
# Async Runtime & Concurrency
tokio = { version = "1.38", features = ["full"] }
futures = "0.3"

# Web Server & REST API (Port 9000)
axum = { version = "0.7", features = ["macros"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }

# CLI & Terminal UI
clap = { version = "4.5", features = ["derive", "env"] }
indicatif = "0.17"
colored = "2.1"

# Serialization & Dynamic Schema
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# HTTP & AI Gateway
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }

# System, Paths & Utilities
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
thiserror = "1.0"
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"

[[bin]]
name = "vicieo"
path = "src/main.rs"
