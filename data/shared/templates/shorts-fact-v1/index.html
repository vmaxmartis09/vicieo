<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=960, height=540, initial-scale=1.0" />
    <title>BẠN CÓ BIẾT ĐIỀU NÀY?</title>
    <script src="assets/gsap.min.js"></script>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body, html { width: 960px; height: 540px; overflow: hidden; background: #030712; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      #root { position: relative; width: 960px; height: 540px; overflow: hidden; background: radial-gradient(circle at 50% 20%, #172554 0%, #030712 100%); }
      .bg-glow-orb-1 {
  position: absolute;
  top: -100px;
  right: -80px;
  width: 320px;
  height: 320px;
  background: radial-gradient(circle, rgba(168, 85, 247, 0.35) 0%, transparent 70%);
  filter: blur(25px);
  z-index: 1;
}

.bg-glow-orb-2 {
  position: absolute;
  bottom: -60px;
  left: -60px;
  width: 300px;
  height: 300px;
  background: radial-gradient(circle, rgba(6, 182, 212, 0.3) 0%, transparent 70%);
  filter: blur(25px);
  z-index: 1;
}

.fact-badge-top {
  position: absolute;
  top: 60px;
  left: 24px;
  right: 24px;
  background: linear-gradient(135deg, #a855f7, #6366f1);
  color: #fff;
  padding: 10px 20px;
  border-radius: 9999px;
  font-size: 18px;
  font-weight: 900;
  text-align: center;
  box-shadow: 0 8px 24px rgba(168, 85, 247, 0.4);
  letter-spacing: 0.04em;
  z-index: 20;
}

.stat-number-box {
  position: absolute;
  top: 130px;
  left: 0;
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 15;
}

.giant-number {
  font-size: 80px;
  font-weight: 950;
  background: linear-gradient(180deg, #ffffff 0%, #38bdf8 60%, #0284c7 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  line-height: 1.0;
  letter-spacing: -0.04em;
  filter: drop-shadow(0 15px 25px rgba(2, 132, 199, 0.6));
}

.unit-label {
  font-size: 18px;
  font-weight: 800;
  color: #facc15;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-top: 4px;
}

.statement-card {
  position: absolute;
  bottom: 76px;
  left: 20px;
  right: 20px;
  background: rgba(15, 23, 42, 0.92);
  border: 1.5px solid rgba(255, 255, 255, 0.2);
  border-radius: 20px;
  padding: 16px 20px;
  backdrop-filter: blur(16px);
  box-shadow: 0 12px 35px rgba(0, 0, 0, 0.6);
  z-index: 25;
}

.statement-text {
  font-size: 16px;
  font-weight: 700;
  color: #f8fafc;
  line-height: 1.45;
  margin-bottom: 8px;
}

.cta-text {
  font-size: 13px;
  font-weight: 800;
  color: #38bdf8;
  display: flex;
  align-items: center;
  gap: 6px;
}
    </style>
  </head>
  <body>
    <div id="root"
         data-composition-id="main"
         data-start="0"
         data-duration="3.0"
         data-width="960"
         data-height="540">

      <!-- Background Animated Glow Orbs -->
      <div id="orb1" class="bg-glow-orb-1 clip" data-start="0" data-duration="3.0" data-track-index="0"></div>
      <div id="orb2" class="bg-glow-orb-2 clip" data-start="0" data-duration="3.0" data-track-index="0"></div>

      <!-- Hook Top Badge -->
      <div id="fact-hook" class="fact-badge-top clip" data-start="0" data-duration="3.0" data-track-index="2">
        💡 BẠN CÓ BIẾT ĐIỀU NÀY?
      </div>

      <!-- Kinetic Stat Big Number -->
      <div id="stat-box" class="stat-number-box clip" data-start="0.4" data-duration="2.6" data-track-index="2">
        <div id="stat-num" class="giant-number">10.000</div>
        <div id="unit" class="unit-label">HẠT DẺ MỖI MÙA THU</div>
      </div>

      <!-- Fact Statement Glass Card -->
      <div id="statement" class="statement-card clip" data-start="1.6" data-duration="1.4" data-track-index="2">
        <div class="statement-text">Mỗi chú sóc nhỏ có thể giấu hơn 10.000 hạt dẻ mỗi mùa thu và nhớ chính xác 90% vị trí nhờ khứu giác siêu phàm!</div>
        <div class="cta-text">
          <span>❤️</span>
          <span>Thả tim và follow Sóc Nhỏ TV nhé!</span>
        </div>
      </div>

      <audio id="audio-voiceover" class="clip" src="assets/voiceover.mp3" data-start="0" data-duration="3.0" data-track-index="3"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Kinetic Typography animations
      tl.fromTo("#fact-hook", { y: -40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "back.out(1.8)" }, 0.1);
      tl.fromTo("#stat-box", { scale: 0.2, rotation: -12, opacity: 0 }, { scale: 1, rotation: 0, opacity: 1, duration: 0.5, ease: "back.out(2)" }, 0.4);
      tl.fromTo("#unit", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power2.out" }, 0.7);
      tl.fromTo("#statement", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power2.out" }, 1.6);

      // Subtle float animation for orbs
      tl.to("#orb1", { x: 30, y: 20, duration: 2.5, ease: "sine.inOut", yoyo: true, repeat: -1 }, 0);
      tl.to("#orb2", { x: -30, y: -20, duration: 2.8, ease: "sine.inOut", yoyo: true, repeat: -1 }, 0);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
