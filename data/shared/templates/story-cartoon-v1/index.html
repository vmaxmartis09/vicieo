<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=540, height=960, initial-scale=1.0" />
    <title>Hạt Dẻ Thần Kỳ Của Sóc Bi</title>
    <script src="assets/gsap.min.js"></script>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body, html { width: 540px; height: 960px; overflow: hidden; background: #0f172a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      #root { position: relative; width: 540px; height: 960px; overflow: hidden; background: linear-gradient(180deg, #1e1b4b 0%, #0f172a 100%); }
      /* Story Cartoon V1 Styles */
.story-title-banner {
  position: absolute;
  top: 90px;
  left: 20px;
  right: 20px;
  background: linear-gradient(135deg, #8b5cf6, #ec4899);
  color: #fff;
  padding: 12px 20px;
  border-radius: 9999px;
  font-size: 24px;
  font-weight: 900;
  text-align: center;
  box-shadow: 0 10px 30px rgba(139, 92, 246, 0.4);
  z-index: 20;
}

.character-wrapper {
  position: absolute;
  top: 170px;
  left: 50%;
  transform: translateX(-50%);
  width: 260px;
  height: 260px;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 10;
}

.character-img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  filter: drop-shadow(0 15px 25px rgba(0, 0, 0, 0.6));
}

.book-page-wrapper {
  position: absolute;
  top: 450px;
  left: 20px;
  right: 20px;
  background: #fefce8;
  border: 3px solid #ca8a04;
  border-radius: 20px;
  padding: 24px;
  color: #713f12;
  box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
  z-index: 20;
}

.story-body {
  font-size: 22px;
  font-weight: 700;
  line-height: 1.45;
  text-align: justify;
}

.moral-box {
  position: absolute;
  bottom: 160px;
  left: 20px;
  right: 20px;
  background: rgba(15, 23, 42, 0.95);
  border: 1.5px solid rgba(255, 255, 255, 0.2);
  padding: 12px 20px;
  border-radius: 16px;
  color: #fde047;
  font-size: 20px;
  font-weight: 800;
  text-align: center;
  z-index: 25;
}
    </style>
  </head>
  <body>
    <div id="root"
         data-composition-id="main"
         data-start="0"
         data-duration="4.0"
         data-width="540"
         data-height="960">

      <!-- Header Title Banner -->
      <div id="title-banner" class="story-title-banner clip" data-start="0" data-duration="4.0" data-track-index="2">
        📖 Hạt Dẻ Thần Kỳ Của Sóc Bi
      </div>

      <!-- Character Bi Illustration -->
      <div id="character-illustration" class="character-wrapper clip"
           data-start="0.3"
           data-duration="3.7"
           data-track-index="1">
        <img src="assets/character.png" alt="Sóc Bi" class="character-img" />
      </div>

      <!-- Book Page Reading -->
      <div id="book-page" class="book-page-wrapper clip" data-start="0.5" data-duration="3.5" data-track-index="2">
        <p class="story-body">Ngày xửa ngày xưa, trong một khu rừng thông rực rỡ nắng ấm, Sóc Bi tình cờ nhặt được một hạt dẻ phát ra ánh sáng vàng lấp lánh...</p>
      </div>

      <!-- Moral Lesson -->
      <div id="moral" class="moral-box clip" data-start="1.8" data-duration="2.2" data-track-index="2">
        ✨ Bài học: Biết chia sẻ niềm vui sẽ nhân lên gấp bội!
      </div>

      <!-- Voiceover Audio -->
      <audio id="audio-voiceover" class="clip" src="assets/voiceover.mp3" data-start="0" data-duration="4.0" data-track-index="3"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#title-banner", { y: -50, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "back.out(1.6)" }, 0.1);
      tl.fromTo("#character-illustration", { scale: 0.8, opacity: 0, y: 30 }, { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.3);
      tl.fromTo("#book-page", { scale: 0.9, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "power2.out" }, 0.5);
      tl.fromTo("#moral", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "back.out(1.5)" }, 1.8);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
