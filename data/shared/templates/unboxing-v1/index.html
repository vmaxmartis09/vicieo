<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=540, height=960, initial-scale=1.0" />
    <title>Bộ Đồ Chơi Lắp Ráp Sóc Nhỏ Bi</title>
    <script src="assets/gsap.min.js"></script>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body, html { width: 540px; height: 960px; overflow: hidden; background: #0a0a0a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      #root { position: relative; width: 540px; height: 960px; overflow: hidden; background: radial-gradient(circle at 50% 30%, #2e1065 0%, #030712 100%); }
      .unbox-header {
  position: absolute;
  top: 90px;
  left: 20px;
  right: 20px;
  background: linear-gradient(135deg, #ea580c, #c2410c);
  color: #fff;
  padding: 10px 18px;
  border-radius: 9999px;
  font-size: 18px;
  font-weight: 900;
  text-align: center;
  box-shadow: 0 8px 24px rgba(234, 88, 12, 0.45);
  letter-spacing: 0.02em;
  z-index: 20;
}

.product-showcase {
  position: absolute;
  top: 160px;
  left: 0;
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 15;
}

.product-glow-halo {
  position: absolute;
  width: 280px;
  height: 280px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(249, 115, 22, 0.25) 0%, transparent 70%);
  filter: blur(15px);
  z-index: 10;
}

.product-cutout {
  max-width: 240px;
  max-height: 240px;
  object-fit: contain;
  filter: drop-shadow(0 15px 25px rgba(0, 0, 0, 0.7));
  z-index: 16;
}

.product-label {
  margin-top: 14px;
  font-size: 20px;
  font-weight: 800;
  color: #ffffff;
  text-shadow: 0 2px 10px rgba(0,0,0,0.8);
  z-index: 16;
}

.countdown-badge {
  position: absolute;
  top: 250px;
  left: 50%;
  transform: translateX(-50%);
  background: #fbbf24;
  color: #000;
  padding: 8px 20px;
  border-radius: 9999px;
  font-size: 18px;
  font-weight: 900;
  box-shadow: 0 4px 18px rgba(251, 191, 36, 0.6);
  z-index: 30;
}

.detail-pill {
  position: absolute;
  bottom: 180px;
  left: 20px;
  right: 20px;
  background: rgba(15, 23, 42, 0.92);
  border: 2px solid rgba(249, 115, 22, 0.6);
  backdrop-filter: blur(16px);
  color: #fff;
  padding: 14px 18px;
  border-radius: 20px;
  box-shadow: 0 12px 35px rgba(0, 0, 0, 0.6);
  z-index: 25;
}

.detail-title {
  font-size: 13px;
  font-weight: 800;
  color: #fb923c;
  margin-bottom: 4px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.detail-desc {
  font-size: 15px;
  font-weight: 700;
  color: #f1f5f9;
  line-height: 1.4;
}
    </style>
  </head>
  <body>
    <div id="root"
         data-composition-id="main"
         data-start="0"
         data-duration="3.5"
         data-width="540"
         data-height="960">

      <!-- Header -->
      <div id="hdr" class="unbox-header clip" data-start="0" data-duration="3.5" data-track-index="2">
        📦 CÙNG ĐẬP HỘP SIÊU PHẨM MỚI VỀ
      </div>

      <!-- Countdown (Starts first 1.8s) -->
      <div id="cd" class="countdown-badge clip" data-start="0.2" data-duration="1.6" data-track-index="2">
        ⏳ 3.. 2.. 1.. MỞ!
      </div>

      <!-- Product Showcase (Punch-in reveal at 1.8s) -->
      <div id="showcase" class="product-showcase clip" data-start="1.8" data-duration="1.7" data-track-index="2">
        <div class="product-glow-halo"></div>
        <img id="prod-img" src="assets/product.png" class="product-cutout" alt="Product" />
        <div id="prod-title" class="product-label">Bộ Đồ Chơi Lắp Ráp Sóc Nhỏ Bi</div>
      </div>

      <!-- Detail Card (Punch-in at 2.4s) -->
      <div id="detail" class="detail-pill clip" data-start="2.4" data-duration="1.1" data-track-index="2">
        <div class="detail-title">🔍 Cảm nhận đầu tiên</div>
        <div class="detail-desc">Chất lượng nhựa ABS bóng mịn, khớp nối chắc chắn!</div>
      </div>

      <audio id="audio-voiceover" class="clip" src="assets/voiceover.mp3" data-start="0" data-duration="3.5" data-track-index="3"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#hdr", { y: -30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power2.out" }, 0.1);
      tl.fromTo("#cd", { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2)" }, 0.2);
      tl.to("#cd", { scale: 0.8, opacity: 0, duration: 0.2 }, 1.7);
      
      // Punch-in effect
      tl.fromTo("#showcase", { scale: 0.3, opacity: 0, rotation: -10 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.5, ease: "back.out(1.8)" }, 1.8);
      tl.fromTo("#detail", { y: 50, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power2.out" }, 2.4);
      
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
