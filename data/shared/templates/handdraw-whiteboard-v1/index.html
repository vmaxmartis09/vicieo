<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=540, height=960, initial-scale=1.0" />
    <title>🎨 HỌC VẼ CHÚ SÓC BI DỄ THƯƠNG</title>
    <script src="assets/gsap.min.js"></script>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body, html { width: 540px; height: 960px; overflow: hidden; background: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      #root { position: relative; width: 540px; height: 960px; overflow: hidden; }
      .whiteboard-frame {
  position: absolute;
  inset: 16px;
  background: #ffffff;
  border: 4px solid #e2e8f0;
  border-radius: 28px;
  box-shadow: 0 12px 35px rgba(0, 0, 0, 0.15);
  overflow: hidden;
}

.whiteboard-header {
  position: absolute;
  top: 90px;
  left: 30px;
  right: 30px;
  background: linear-gradient(135deg, #0284c7, #0369a1);
  color: #fff;
  padding: 10px 20px;
  border-radius: 9999px;
  font-size: 18px;
  font-weight: 900;
  text-align: center;
  box-shadow: 0 8px 20px rgba(2, 132, 199, 0.35);
  letter-spacing: 0.02em;
  z-index: 20;
}

.drawing-stage {
  position: absolute;
  top: 160px;
  left: 30px;
  right: 30px;
  height: 480px;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 10;
}

.whiteboard-video {
  width: 100%;
  height: 100%;
  object-fit: contain;
  border-radius: 16px;
}

.instruction-pill {
  position: absolute;
  bottom: 180px;
  left: 30px;
  right: 30px;
  background: rgba(15, 23, 42, 0.90);
  border: 2px solid rgba(2, 132, 199, 0.5);
  backdrop-filter: blur(12px);
  color: #fff;
  padding: 14px 20px;
  border-radius: 20px;
  text-align: center;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
  z-index: 25;
}

.step-label {
  font-size: 12px;
  font-weight: 800;
  color: #38bdf8;
  margin-bottom: 4px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.caption-text {
  font-size: 15px;
  font-weight: 700;
  color: #f8fafc;
  line-height: 1.4;
}
    </style>
  </head>
  <body>
    <div id="root"
         data-composition-id="main"
         data-start="0"
         data-duration="3.0"
         data-width="540"
         data-height="960">

      <div class="whiteboard-frame">
        <!-- Header -->
        <div id="hdr" class="whiteboard-header clip" data-start="0" data-duration="3.0" data-track-index="2">
          🎨 HỌC VẼ CHÚ SÓC BI DỄ THƯƠNG
        </div>

        <!-- Video Drawing Stage -->
        <div id="stage" class="drawing-stage clip" data-start="0.2" data-duration="2.8" data-track-index="2">
          <video id="wb-vid" class="whiteboard-video" src="assets/whiteboard.mp4" playsinline muted preload="auto"></video>
        </div>

        <!-- Instruction Pill -->
        <div id="instruction" class="instruction-pill clip" data-start="0.5" data-duration="2.5" data-track-index="2">
          <div class="step-label">BƯỚC 1: PHÁC THẢO NÉT CƠ BẢN</div>
          <div class="caption-text">Bé hãy vẽ hình tròn trước, rồi thêm đôi tai tam giác nha!</div>
        </div>
      </div>

      <audio id="audio-voiceover" class="clip" src="assets/voiceover.mp3" data-start="0" data-duration="3.0" data-track-index="3"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#hdr", { y: -30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power2.out" }, 0.1);
      tl.fromTo("#stage", { scale: 0.9, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "power2.out" }, 0.2);
      tl.fromTo("#instruction", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power2.out" }, 0.5);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
