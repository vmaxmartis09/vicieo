<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=540, height=960, initial-scale=1.0" />
    <title>Bí kíp săn Deal hot giảm 50% hôm nay!</title>
    <script src="assets/gsap.min.js"></script>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body, html { width: 540px; height: 960px; overflow: hidden; background: #0b0f19; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      #root { position: relative; width: 540px; height: 960px; overflow: hidden; background: radial-gradient(circle at 50% 30%, #1e1b4b 0%, #0b0f19 100%); }
      /* TikTok Sales V1 Styles */
.sales-badge-hook {
  position: absolute;
  top: 90px;
  left: 20px;
  right: 20px;
  background: linear-gradient(135deg, #ff0055, #ff5500);
  padding: 14px 20px;
  border-radius: 16px;
  color: #fff;
  font-size: 24px;
  font-weight: 900;
  text-align: center;
  box-shadow: 0 10px 30px rgba(255, 0, 85, 0.4);
  z-index: 20;
  line-height: 1.3;
}

.product-showcase {
  position: absolute;
  top: 190px;
  left: 50%;
  transform: translateX(-50%);
  width: 380px;
  height: 440px;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 10;
}

.product-img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  filter: drop-shadow(0 15px 30px rgba(0, 0, 0, 0.7));
}

.price-container {
  position: absolute;
  bottom: 230px;
  left: 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  background: rgba(15, 23, 42, 0.9);
  backdrop-filter: blur(12px);
  padding: 10px 20px;
  border-radius: 16px;
  border: 1px solid rgba(255, 255, 255, 0.15);
  z-index: 20;
}

.orig-price {
  color: #94a3b8;
  font-size: 18px;
  text-decoration: line-through;
}

.disc-price {
  color: #fbbf24;
  font-size: 28px;
  font-weight: 900;
}

.badge-percent {
  background: #ef4444;
  color: #fff;
  padding: 4px 10px;
  border-radius: 8px;
  font-size: 16px;
  font-weight: 800;
}

.cta-cart-anchor {
  position: absolute;
  bottom: 160px;
  left: 20px;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  background: #ffcc00;
  color: #000;
  padding: 10px 22px;
  border-radius: 9999px;
  font-size: 18px;
  font-weight: 900;
  z-index: 25;
  box-shadow: 0 6px 20px rgba(255, 204, 0, 0.4);
}
    </style>
  </head>
  <body>
    <div id="root"
         data-composition-id="main"
         data-start="0"
         data-duration="4.0"
         data-width="540"
         data-height="960">

      <!-- Hook 3s -->
      <div id="hook-badge" class="sales-badge-hook clip"
           data-start="0"
           data-duration="3.5"
           data-track-index="2">
        Bí kíp săn Deal hot giảm 50% hôm nay!
      </div>

      <!-- Product Showcase Image -->
      <div id="product-card" class="product-showcase clip"
           data-start="0.3"
           data-duration="3.7"
           data-track-index="1">
        <img src="assets/product.png" alt="Product" class="product-img" />
      </div>

      <!-- Price Box -->
      <div id="price-box" class="price-container clip"
           data-start="1.5"
           data-duration="2.5"
           data-track-index="2">
        <span class="disc-price">149.000đ</span>
        <span class="orig-price">299.000đ</span>
        <span class="badge-percent">-50%</span>
      </div>

      <!-- CTA Giỏ hàng trong safe-zone -->
      <div id="cta-cart" class="cta-cart-anchor clip"
           data-start="2.2"
           data-duration="1.7999999999999998"
           data-track-index="2">
        🛒 Bấm giỏ hàng góc trái ngay!
      </div>

      <!-- Background Audio -->
      <audio id="audio-voiceover" class="clip" src="assets/voiceover.mp3" data-start="0" data-duration="4.0" data-track-index="3"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#hook-badge", { y: -50, opacity: 0, scale: 0.9 }, { y: 0, opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.7)" }, 0.1);
      tl.fromTo("#product-card", { scale: 0.7, opacity: 0, y: 40 }, { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.3);
      tl.to("#product-card", { y: -10, duration: 1.2, repeat: -1, yoyo: true, ease: "sine.inOut" }, 0.8);
      tl.fromTo("#price-box", { x: -40, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, ease: "power2.out" }, 1.5);
      tl.fromTo("#cta-cart", { scale: 0.8, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "elastic.out(1, 0.5)" }, 2.2);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
