[package]
name = "fe-core"
version = "1.0.0"
edition = "2021"
description = "100% Rust Native Internal Engine for the 5-Agent Frontend Master AI Team (Zero Python, Zero-Token Bus, Graduated Ponytail Gatekeeper)"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1"
walkdir = "2"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1"

[[bin]]
name = "fe-core"
path = "src/main.rs"
